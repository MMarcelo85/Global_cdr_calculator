# Builds the desktop app: portable Windows .exe, Linux executable and macOS .app (zip), plus Flatpak and Snap packages.
# - Manually: GitHub > Actions > "Build desktop app" > Run workflow (download from the run's Artifacts).
# - Release: push a tag like v2.0.0; the executables are attached to a GitHub Release.
name: Build desktop app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            exe: CDR_Global_Calculator.exe
            asset: CDR_Global_Calculator_Windows.exe
          - os: ubuntu-22.04   # older glibc = runs on more Linux distributions
            exe: CDR_Global_Calculator
            asset: CDR_Global_Calculator_Linux
          - os: macos-latest   # Apple Silicon (M1 and later)
            asset: CDR_Global_Calculator_macOS_AppleSilicon.zip
          - os: macos-15-intel # Intel Macs
            asset: CDR_Global_Calculator_macOS_Intel.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Install PyInstaller
        run: python -m pip install pyinstaller
      - name: Build executable (Windows / Linux)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          pyinstaller --onefile --windowed --name CDR_Global_Calculator desktop_app.py
          mv "dist/${{ matrix.exe }}" "dist/${{ matrix.asset }}"
      - name: Build app (macOS)
        if: runner.os == 'macOS'
        run: |
          APP="CDR Global Calculator"
          pyinstaller --windowed --name "$APP" --osx-bundle-identifier io.github.mmarcelo85.CDRGlobalCalculator desktop_app.py
          # Smoke test: the app must still be running after 15 s (no crash at startup).
          "dist/$APP.app/Contents/MacOS/$APP" & PID=$!
          sleep 15
          kill -0 $PID && kill $PID
          # ditto keeps the .app bundle intact (symlinks, signature) inside the zip.
          ditto -c -k --keepParent "dist/$APP.app" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: packaging/release_notes.md
          files: dist/${{ matrix.asset }}

  flatpak:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CDR_Global_Calculator_Linux
          path: dist
      - name: Build Flatpak bundle
        run: |
          sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          APP=io.github.mmarcelo85.CDRGlobalCalculator
          flatpak-builder --user --install-deps-from=flathub --force-clean --repo=repo build-dir packaging/flatpak/$APP.yml
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo repo CDR_Global_Calculator.flatpak $APP
      - uses: actions/upload-artifact@v4
        with:
          name: CDR_Global_Calculator.flatpak
          path: CDR_Global_Calculator.flatpak
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: packaging/release_notes.md
          files: CDR_Global_Calculator.flatpak

  snap:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CDR_Global_Calculator_Linux
          path: dist
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          sed -i "s/^version: .*/version: '${GITHUB_REF_NAME#v}'/" snap/snapcraft.yaml
      - uses: snapcore/action-build@v1
        id: snap
      - name: Rename
        run: mv "${{ steps.snap.outputs.snap }}" CDR_Global_Calculator.snap
      - uses: actions/upload-artifact@v4
        with:
          name: CDR_Global_Calculator.snap
          path: CDR_Global_Calculator.snap
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: packaging/release_notes.md
          files: CDR_Global_Calculator.snap
